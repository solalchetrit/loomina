# Fly.io — serveur vocal Loomina (région Paris).
# Déploiement : depuis la racine du dépôt, `fly deploy --config voice/fly.toml --dockerfile voice/Dockerfile`
app = "loomina-voice"
primary_region = "cdg"

[build]
  dockerfile = "voice/Dockerfile"

[env]
  PORT = "8080"
  PUBLIC_URL = "https://loomina-voice.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
